<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CropWise — AI farming assistant</title>
    <meta name="description" content="Right crop for your soil, fertiliser in bags, the best mandi after transport, a photo Crop Doctor and a grounded assistant in six languages." />
    <meta name="theme-color" content="#0F3B2A" />
    <link rel="icon" href="/static/app/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/static/app/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/static/app/icon-192.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CropWise" />
    <meta property="og:title" content="CropWise — AI farming assistant for India's small farmers" />
    <meta property="og:description" content="Right crop for your soil, fertiliser in bags, the best mandi after transport, a photo Crop Doctor and a grounded assistant in six languages, with its results measured in public." />
    <meta property="og:url" content="https://cropwise-six.vercel.app/" />
    <meta property="og:image" content="https://cropwise-six.vercel.app/static/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&family=Noto+Sans+Malayalam:wght@400;600&family=Noto+Sans+Kannada:wght@400;600&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint so dark mode never flashes light.
      try {
        var t = localStorage.getItem('cw.theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
        var l = localStorage.getItem('cw.lang');
        if (l) document.documentElement.lang = l;
      } catch (e) {}
    </script>
    <script>
      // After a deploy, an old page can ask for script files that no longer exist. Reload once to
      // fetch the new page instead of showing a blank screen (at most once a minute).
      (function () {
        function retry() {
          try {
            var last = Number(sessionStorage.getItem('cw.reloaded') || 0)
            if (Date.now() - last < 60000) return
            sessionStorage.setItem('cw.reloaded', String(Date.now()))
          } catch (e) {}
          location.reload()
        }
        window.addEventListener('error', function (e) {
          var t = e.target
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK') && /\/static\/app\/assets\//.test(t.src || t.href || '')) retry()
        }, true)
        window.addEventListener('vite:preloadError', function (e) { e.preventDefault(); retry() })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>CropWise needs JavaScript. The API is at /docs.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
