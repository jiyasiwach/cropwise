{# Link previews on LinkedIn, WhatsApp and X. Include with og_title / og_desc / og_path set. #}
<meta property="og:type" content="website">
<meta property="og:site_name" content="CropWise">
<meta property="og:title" content="{{ og_title }}">
<meta property="og:description" content="{{ og_desc }}">
<meta property="og:url" content="https://cropwise-six.vercel.app{{ og_path }}">
<meta property="og:image" content="https://cropwise-six.vercel.app/static/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="CropWise — AI farming assistant for India's small farmers">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ og_title }}">
<meta name="twitter:description" content="{{ og_desc }}">
<meta name="twitter:image" content="https://cropwise-six.vercel.app/static/og.png">
